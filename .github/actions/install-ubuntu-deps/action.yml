name: Install Ubuntu dependencies
description: >
  The distribution's own packages: OpenCV 4 and Qt 6.4 on Ubuntu 24.04, the oldest versions the project
  supports, so building with them proves the OpenCV 4.x and Qt 6.4 floors still hold.
runs:
  using: composite
  steps:
    # The list lives in the script, which docker/ubuntu-24.04.Dockerfile runs too.
    - name: Install packages
      shell: bash
      run: sudo bash scripts/install-ubuntu-deps.sh
